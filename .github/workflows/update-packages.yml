name: Update packages

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            connect-timeout = 3

      - name: Update packages
        run: |
          packages="$(
            nix-instantiate \
              --eval \
              --strict \
              --raw \
              -E '
                let
                  scope = import ./default.nix { };
                in
                builtins.concatStringsSep "\n" (
                  builtins.attrNames (scope.packages scope)
                )
              '
          )"

          while read -r package; do
            [ -z "${package}" ] && continue

            echo "::group::Update ${package}"

            nix-shell tools/updater.nix --argstr package "${package}"

            echo "::endgroup::"
          done <<< "${packages}"

      - name: Check changes
        run: git diff --check

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/update-packages
          delete-branch: true
          commit-message: "chore: update packages"
          title: "chore: update packages"
          body: |
            Automated package updates generated by `nix-update`.
