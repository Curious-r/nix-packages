name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            connect-timeout = 3
            extra-substituters = https://cache.nixos.org https://nix-community.cachix.org https://cache.numtide.com
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Check formatting
        run: nix fmt -- --check $(git ls-files '*.nix')

  check:
    name: Flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            connect-timeout = 3
            extra-substituters = https://cache.nixos.org https://nix-community.cachix.org https://cache.numtide.com
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Check flake
        run: nix flake check --all-systems

  evaluate:
    name: Package API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read nixpkgs revision
        id: nixpkgs
        run: |
          rev="$(jq -r '
            .nodes.root.inputs.nixpkgs
            as $nixpkgs
            | .nodes[$nixpkgs].locked.rev
          ' flake.lock)"

          echo "rev=${rev}" >> "${GITHUB_OUTPUT}"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ steps.nixpkgs.outputs.rev }}.tar.gz
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            connect-timeout = 3
            extra-substituters = https://cache.nixos.org https://nix-community.cachix.org https://cache.numtide.com
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Check package API
        run: |
          nix-instantiate \
            --eval \
            --strict \
            -E '
              let
                packages = import ./default.nix { };
                packageNames = builtins.attrNames packages;
              in
                assert builtins.all (
                  name: packages.${name}.type == "derivation"
                ) packageNames;
                true
            '

  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read

    outputs:
      build: ${{ steps.scope.outputs.build }}
      build-all: ${{ steps.scope.outputs.build-all }}
      packages: ${{ steps.scope.outputs.packages }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          list-files: json
          filters: |
            changed:
              - '**'

      - name: Determine build scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES: ${{ steps.filter.outputs.changed_files }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
            echo "build-all=true" >> "${GITHUB_OUTPUT}"
            echo 'packages=[]' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          build_all=false
          declare -A packages=()

          while IFS= read -r path; do
            case "${path}" in
              README.md|docs/*)
                ;;
              pkgs/by-name/*/*/*)
                relative="${path#pkgs/by-name/}"
                shard="${relative%%/*}"
                relative="${relative#*/}"
                package="${relative%%/*}"

                if [[ ! -f "pkgs/by-name/${shard}/${package}/package.nix" ]]; then
                  build_all=true
                else
                  packages["${package}"]=1
                fi
                ;;
              *)
                build_all=true
                ;;
            esac
          done < <(jq -r '.[]' <<< "${CHANGED_FILES}")

          if [[ "${build_all}" == "true" ]]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
            echo "build-all=true" >> "${GITHUB_OUTPUT}"
            echo 'packages=[]' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          package_json="$(
            printf '%s\n' "${!packages[@]}" |
              sort |
              jq -Rsc 'split("\n") | map(select(length > 0))'
          )"

          if [[ "${package_json}" == "[]" ]]; then
            echo "build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "build=true" >> "${GITHUB_OUTPUT}"
          fi

          echo "build-all=false" >> "${GITHUB_OUTPUT}"
          echo "packages=${package_json}" >> "${GITHUB_OUTPUT}"

  matrix:
    name: Generate build matrix
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            connect-timeout = 3
            extra-substituters = https://cache.nixos.org https://nix-community.cachix.org https://cache.numtide.com
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Generate matrix
        id: generate
        env:
          BUILD_ALL: ${{ needs.changes.outputs.build-all }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          set -euo pipefail

          if [[ "${BUILD_ALL}" == "true" ]]; then
            matrix="$(nix-instantiate \
              --eval \
              --json \
              --strict \
              --expr \
              'import ./ci/jobs.nix {}'
            )"
          else
            matrix="$(nix-instantiate \
              --eval \
              --json \
              --strict \
              --expr \
              "import ./ci/jobs.nix { packageNames = ${PACKAGES}; }"
            )"
          fi

          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.name }}
    needs:
      - check
      - evaluate
      - changes
      - matrix
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read nixpkgs revision
        id: nixpkgs
        run: |
          rev="$(jq -r '
            .nodes.root.inputs.nixpkgs
            as $nixpkgs
            | .nodes[$nixpkgs].locked.rev
          ' flake.lock)"

          echo "rev=${rev}" >> "${GITHUB_OUTPUT}"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ steps.nixpkgs.outputs.rev }}.tar.gz
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            connect-timeout = 3
            extra-substituters = https://cache.nixos.org https://nix-community.cachix.org https://cache.numtide.com
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: curious
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: "(-source$|nixpkgs\\.tar\\.gz$)"

      - name: Build
        env:
          PACKAGE: ${{ matrix.package }}
        run: nix-build --no-out-link -A "${PACKAGE}"

  result:
    name: CI result
    needs:
      - format
      - check
      - evaluate
      - changes
      - matrix
      - build
    if: always()
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Fail on failed required jobs
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
